name: phosphor_flutter
description: >-
  Vendored phosphor_flutter 2.1.0 (Phosphor icons for Flutter), patched by
  WorkNexus for Flutter 3.44+ where IconData is a final class. See PATCH.md.
version: 2.1.0
publish_to: 'none'
homepage: https://phosphoricons.com/
repository: https://github.com/phosphor-icons/phosphor-flutter

environment:
  # Extension types (the duotone patch) need Dart 3.3+.
  sdk: '>=3.3.0 <4.0.0'
  flutter: '>=1.17.0'

dependencies:
  flutter:
    sdk: flutter

flutter:
  fonts:
    - family: PhosphorBold
      fonts:
        - asset: lib/fonts/Phosphor-Bold.ttf
          weight: 400
    - family: PhosphorDuotone
      fonts:
        - asset: lib/fonts/Phosphor-Duotone.ttf
          weight: 400
    - family: PhosphorFill
      fonts:
        - asset: lib/fonts/Phosphor-Fill.ttf
          weight: 400
    - family: PhosphorLight
      fonts:
        - asset: lib/fonts/Phosphor-Light.ttf
          weight: 400
    - family: PhosphorThin
      fonts:
        - asset: lib/fonts/Phosphor-Thin.ttf
          weight: 400
    - family: PhosphorRegular
      fonts:
        - asset: lib/fonts/Phosphor.ttf
          weight: 400
