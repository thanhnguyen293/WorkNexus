name: work_nexus
description: "A new Flutter project."
# Prevents accidental `flutter pub publish` for this private package.
publish_to: 'none'

version: 1.2.1+4

environment:
  # No caret anywhere in this file (project rule): use explicit lower/upper bounds.
  sdk: '>=3.12.0 <4.0.0'

# ─────────────────────────────────────────────────────────────────────────────
# Dependency policy (project rule): versions are PINNED EXACTLY — no `^`.
# Bump deliberately (edit the number + re-run `flutter pub get`), never implicitly.
# Toolchain-sensitive pins carry a comment explaining the ceiling; do not raise
# them without re-verifying codegen (`dart run build_runner build`) still works.
# ─────────────────────────────────────────────────────────────────────────────
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # UI / icons / fonts
  cupertino_icons: 2.0.0
  # Even strokes at every size (Phosphor's font has uneven ones); the
  # weight is picked per icon (`…300` regular UI, `…500` emphasis).
  lucide_icons_flutter: 3.1.25
  # Renders the bundled monochrome provider brand logos (assets/brands/*.svg),
  # tinted at draw time. Pure-Dart (vector_graphics) — no native-assets build
  # hook, so it does not affect build_runner.
  flutter_svg: 2.3.0
  # Be Vietnam Pro (default UI font). Fetched from Google Fonts at first run and
  # cached on disk; falls back to the bundled sans until then.
  google_fonts: 8.2.1
  gpt_markdown: 1.3.4
  html2md: 1.3.2
  # ZenTao descriptions and comments are HTML (its rich-text editor): rendered
  # as HTML rather than converted to Markdown. Pure Dart, no native code.
  flutter_widget_from_html_core: 0.17.4
  # Splits a ZenTao bug's HTML into its steps / actual / expected sections.
  html: 0.15.7
  # Rich-text editing of ZenTao descriptions (its web editor's features), with
  # HTML in and out. Pure Dart apart from quill_native_bridge's clipboard
  # method channel.
  flutter_quill: 11.6.0
  flutter_quill_delta_from_html: 1.5.3
  vsc_quill_delta_to_html: 1.0.5
  cached_network_image: 4.0.3
  # The cache cached_network_image fills; Windows toasts read a sender's
  # picture from it as a local file (they cannot fetch https themselves).
  flutter_cache_manager: 3.4.5
  image_picker: 1.2.4
  two_dimensional_scrollables: 0.5.5
  # In-app attachment preview (repro videos). The macOS backend
  # (video_player_avfoundation) is a standard method-channel plugin — not a
  # native-assets/FFI build hook — so it does not affect build_runner.
  video_player: 2.14.1
  # Telegram sticker import: renders an animated (.tgs) sticker's Lottie frames
  # so they can become an animated WebP. Pure Dart (no native-assets hook).
  lottie: 3.6.1
  # Encodes imported stickers as (animated) WebP in pure Dart — 4.12 is the
  # first release that writes WebP, so no ffmpeg / libwebp is needed. Already a
  # transitive dependency; pinned here for that encoder.
  image: 4.12.0

  # State management & DI. injectable = annotation-driven registration on top of
  # get_it (codegen via injectable_generator below).
  flutter_riverpod: 3.4.3
  get_it: 9.3.0
  injectable: 3.0.0

  # Functional error handling (Either/Option) — pairs with core/error
  fpdart: 1.2.0

  # Persistence (local-first source of truth). drift is capped at 2.34.x with
  # drift_dev: 2.35 needs analyzer 13+, which stable freezed 3.x does not
  # accept (freezed 4 needs Dart 3.13).
  drift: 2.34.4
  drift_flutter: 0.3.1

  # Networking / secure storage.
  dio: 5.11.1
  talker_dio_logger: 5.1.20
  talker_flutter: 5.1.20
  # Type-safe dio client generator for the ZenTao v1 REST API. Runtime
  # annotations only; the code generator is a dev_dependency below.
  retrofit: 4.10.0
  flutter_secure_storage: 11.2.0

  # Codegen annotations.
  freezed_annotation: 3.1.0
  json_annotation: 4.12.0

  # Logging — use instead of print (rule 11.3)
  logger: 2.8.0

  # Utilities
  # path_provider: used directly by core/database to place the drift file in the
  # application-support directory (drift_flutter pulls it in too).
  path_provider: 2.1.6
  window_manager: 0.5.2
  # 0.7+ needs Dart 3.13.
  tray_manager: 0.5.3
  windows_single_instance: 1.2.0
  uuid: 4.6.0
  collection: 1.19.1
  intl: 0.20.2

  # ZenTao chat (xuanxuan/xxd) protocol: AES-256-CBC socket frames + md5 auth.
  pointycastle: 4.0.0
  crypto: 3.0.7
  # Chat attachments: paste images/files from the clipboard, pick files.
  pasteboard: 0.5.0
  file_selector: 1.1.0
  # Files dragged in from the OS: onto the chat, the bug/task editor.
  desktop_drop: 0.8.4
  # video_player backend for Windows/Linux, where the official plugin has no
  # implementation (registered in main.dart; macOS keeps AVFoundation).
  fvp: 0.39.0
  # Desktop notifications for new chat messages (macOS, Windows, Linux).
  flutter_local_notifications: 22.3.2
  # Unread count on the Linux launcher icon (Unity LauncherEntry signal).
  # Held at 0.7.x: desktop_drop depends on dbus ^0.7.
  dbus: 0.7.15
  package_info_plus: 10.2.2
  # Mini apps: a web page the user added, shown inside the shell. Windows
  # (WebView2) and macOS (WKWebView) through flutter_inappwebview, which has no
  # stable Linux backend; Linux (WebKitGTK, which the system ships) through
  # webview_all_linux, used on its own without the rest of webview_all.
  flutter_inappwebview: 6.1.5
  webview_all_linux: 1.4.4
  webview_platform_interface: 1.4.4
  url_launcher: 6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: 6.0.0

  # Codegen. build_runner capped at 2.15.1: 2.16+ needs analyzer 14, which
  # needs a newer `meta` than flutter_test pins on this Flutter.
  build_runner: 2.15.1
  drift_dev: 2.34.0
  # 4.x needs Dart 3.13.
  freezed: 3.2.5
  injectable_generator: 3.0.2
  json_serializable: 6.14.1
  # Retrofit code generator (pairs with the `retrofit` runtime dep). Resolves
  # on this SDK (analyzer-compatible); re-verify codegen if bumped.
  retrofit_generator: 10.2.12

  # Testing
  mocktail: 1.0.5
  sqlite3: 3.5.2

  # Type-safe asset references (assets/brands/*.svg → Assets.brands.*). The
  # build_runner integration of flutter_gen; its generated output (lib/gen/) is
  # gitignored and rebuilt with the other codegen. Re-verify codegen if bumped.
  flutter_gen_runner: 5.15.0

# NOTE: riverpod_lint + custom_lint are intentionally NOT added — they cannot
# resolve on this toolchain (riverpod_lint needs analyzer ^7 or ^9, this SDK
# pins analyzer 8.x; older custom_lint needs freezed_annotation 2.x). Rule
# enforcement lives in analysis_options.yaml via the built-in lint set instead.

# flutter_gen: type-safe asset accessors. Output (lib/gen/) is gitignored and
# regenerated by build_runner. flutter_svg integration makes each .svg an
# SvgGenImage with a `.svg()` builder.
flutter_gen:
  output: lib/gen/
  integrations:
    flutter_svg: true

# The following section is specific to Flutter packages.
flutter:
  uses-material-design: true
  generate: true # enables flutter gen-l10n from lib/l10n/*.arb

  assets:
    # Provider brand logos. GitHub/GitLab/Jira are monochrome marks tinted per
    # brand at render time; ZenTao is a full-color recreation of its whirlpool
    # logo (rendered untinted). Referenced type-safely via flutter_gen.
    - assets/brands/
    # Sticker sets, one folder per set (each must be listed here); the
    # folder name is the set's tab title in the chat's emoji panel.
    - assets/stickers/WorkNexus/
    - assets/stickers/Pepe/
    - assets/stickers/PepeAnim/
    - assets/tray/

  fonts:
    - family: Be Vietnam Pro
      fonts:
        - asset: assets/fonts/BeVietnamPro-Regular.ttf
        - asset: assets/fonts/BeVietnamPro-Italic.ttf
          style: italic
        - asset: assets/fonts/BeVietnamPro-Medium.ttf
          weight: 500
        - asset: assets/fonts/BeVietnamPro-MediumItalic.ttf
          weight: 500
          style: italic
        - asset: assets/fonts/BeVietnamPro-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/BeVietnamPro-SemiBoldItalic.ttf
          weight: 600
          style: italic
        - asset: assets/fonts/BeVietnamPro-Bold.ttf
          weight: 700
        - asset: assets/fonts/BeVietnamPro-BoldItalic.ttf
          weight: 700
          style: italic
    - family: Space Grotesk
      fonts:
        - asset: assets/fonts/SpaceGrotesk-Variable.ttf
    - family: Space Mono
      fonts:
        - asset: assets/fonts/SpaceMono-Regular.ttf
        - asset: assets/fonts/SpaceMono-Bold.ttf
          weight: 700
        - asset: assets/fonts/SpaceMono-Italic.ttf
          style: italic
