# Static analysis config for WorkNexus.
#
# This enforces the mechanizable parts of the project rules in CLAUDE.md via the
# built-in Dart/Flutter lint set. Rules that need a custom analyzer plugin —
# 6.1 (file ≤ 300 lines), 7.2 (no hardcoded colors/spacing), 1.3 / 10.1
# (layer + cross-feature import boundaries) — are enforced in review, because
# custom_lint / riverpod_lint / dart_code_metrics cannot resolve on this
# toolchain (see the note in pubspec.yaml).
#
# After enabling these, run `dart fix --apply` — most findings (const, quotes,
# trailing commas, final, import ordering) auto-fix.

include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - "lib/l10n/app_localizations*.dart"
    - "build/**"

  # Stronger type safety than the defaults.
  language:
    strict-casts: true
    strict-raw-types: true

  errors:
    # Rule 15 — using BuildContext across an async gap is a hard error, and it
    # must not be silenced with `// ignore` (rule 15.2).
    use_build_context_synchronously: error
    # Rule 11.3 — no stray print in shipped code (render errors from Failure).
    avoid_print: warning
    # Rule 12 / 15 — don't silently drop a Future.
    unawaited_futures: warning

linter:
  rules:
    # ── Rule 7 · prefer const, fewer needless rebuilds ──────────────────────
    prefer_const_constructors: true
    prefer_const_constructors_in_immutables: true
    prefer_const_declarations: true
    prefer_const_literals_to_create_immutables: true

    # ── Rule 6 / 7 · widget composition over Container / hardcoded boxes ─────
    sized_box_for_whitespace: true
    use_colored_box: true
    use_decorated_box: true

    # ── Rule 11 · error-handling hygiene ────────────────────────────────────
    only_throw_errors: true

    # ── Rule 12 / 15 · async safety ─────────────────────────────────────────
    unawaited_futures: true

    # ── Rule 14 · immutability / final by default ───────────────────────────
    prefer_final_locals: true
    prefer_final_in_for_each: true

    # ── General consistency & readability ───────────────────────────────────
    prefer_single_quotes: true
    require_trailing_commas: true
    directives_ordering: true
    prefer_relative_imports: true        # matches the existing import style
    avoid_redundant_argument_values: true
    unnecessary_lambdas: true
    avoid_dynamic_calls: true
