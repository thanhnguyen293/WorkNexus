name: Build (macOS & Windows)

# Release Please maintains the stable release PR on main. Desktop builds run
# only when it creates a new stable release; ordinary pushes don't rebuild.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Do not cancel release publication midway when another commit is pushed.
concurrency:
  group: release-build-${{ github.ref }}
  cancel-in-progress: false

env:
  # Pin the repo's exact toolchain (Flutter 3.44.8 -> Dart 3.12.2).
  # No fvm on CI; subosito downloads this exact version.
  FLUTTER_VERSION: "3.44.8"

jobs:
  release-please:
    name: Release PR / publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
    steps:
      - id: rp
        uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # ───────────────────────────── macOS ─────────────────────────────
  build-macos:
    name: Build macOS
    needs: [release-please]
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter ${{ env.FLUTTER_VERSION }}
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Enable macOS desktop
        run: flutter config --enable-macos-desktop

      - name: Install dependencies
        run: flutter pub get

      # Codegen (freezed / drift / injectable / retrofit / json) — required
      # because *.g.dart / *.freezed.dart / *.config.dart are gitignored.
      - name: Run code generation
        run: dart run build_runner build --delete-conflicting-outputs

      # Release build. No Apple cert on CI: the project defaults to ad-hoc
      # (CODE_SIGN_IDENTITY = "-"), so the .app is ad-hoc signed, no secret needed.
      # Owner/repo come from the repository this workflow runs in, so a fork
      # and upstream each build an app that updates from their own releases.
      - name: Point the build at this repository
        shell: bash
        run: |
          sed -i.bak -e "s|^GITHUB_OWNER=.*|GITHUB_OWNER=${{ github.repository_owner }}|" .env
          sed -i.bak -e "s|^GITHUB_REPO=.*|GITHUB_REPO=${{ github.event.repository.name }}|" .env
          rm -f .env.bak

      - name: Build macOS (release, ad-hoc signed)
        run: flutter build macos --release --dart-define-from-file=.env

      # Zip the .app while preserving the bundle (use ditto, not plain zip).
      - name: Package .app
        run: |
          APP="build/macos/Build/Products/Release/WorkNexus.app"
          ditto -c -k --sequesterRsrc --keepParent "$APP" work_nexus-macos.zip

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: worknexus-macos-${{ github.run_number }}
          path: work_nexus-macos.zip
          if-no-files-found: error

  # ──────────────────────────── Windows ────────────────────────────
  build-windows:
    name: Build Windows
    needs: [release-please]
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter ${{ env.FLUTTER_VERSION }}
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      # The repo has no windows/ folder yet -> generate the runner in place.
      # --project-name work_nexus because the "WorkNexus" folder (uppercase) is
      # not a valid Dart package name. This only adds windows/, never touches lib/.
      - name: Generate Windows runner
        run: flutter create --platforms=windows --project-name work_nexus .

      - name: Install dependencies
        run: flutter pub get

      - name: Run code generation
        run: dart run build_runner build --delete-conflicting-outputs

      # Owner/repo come from the repository this workflow runs in, so a fork
      # and upstream each build an app that updates from their own releases.
      - name: Point the build at this repository
        shell: bash
        run: |
          sed -i.bak -e "s|^GITHUB_OWNER=.*|GITHUB_OWNER=${{ github.repository_owner }}|" .env
          sed -i.bak -e "s|^GITHUB_REPO=.*|GITHUB_REPO=${{ github.event.repository.name }}|" .env
          rm -f .env.bak

      - name: Build Windows (release)
        run: flutter build windows --release --dart-define-from-file=.env

      # Zip the whole Release folder (exe + DLLs + data/ must stay together).
      - name: Package build output
        shell: pwsh
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath worknexus-windows.zip

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: worknexus-windows-${{ github.run_number }}
          path: worknexus-windows.zip
          if-no-files-found: error

  # ───────────────────── Publish build artifacts ─────────────────────
  # Runs only for a newly-created stable release and retains only the latest.
  release:
    name: Publish release assets
    needs: [release-please, build-macos, build-windows]
    runs-on: ubuntu-latest
    if: >-
      github.ref == 'refs/heads/main' &&
      needs.release-please.outputs.release_created == 'true'
    permissions:
      contents: write
    steps:
      # Pull both build artifacts flat into dist/ (no per-artifact subfolders).
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # The in-app updater refuses a download whose hash is not listed here.
      - name: Write checksums
        working-directory: dist
        run: sha256sum *.zip > SHA256SUMS.txt

      # Attach the binaries to the versioned release created by Release Please.
      - name: Attach assets to versioned release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ needs.release-please.outputs.tag_name }}" dist/*.zip dist/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" --clobber

      # Retain only the newest published stable release.
      - name: Delete older stable releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          stable_tags="$(gh api --paginate \
            "repos/${GITHUB_REPOSITORY}/releases" \
            | jq -s 'add | map(select(.draft == false and .prerelease == false)) | sort_by(.published_at) | reverse | map(.tag_name) | .[]')"
          latest_tag="$(printf '%s\n' "$stable_tags" | sed -n '1p')"
          if [[ -z "$latest_tag" ]]; then
            echo "No published stable release to retain."
            exit 0
          fi

          while IFS= read -r tag; do
            [[ -z "$tag" || "$tag" == "$latest_tag" ]] && continue
            gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --yes
          done <<< "$stable_tags"
