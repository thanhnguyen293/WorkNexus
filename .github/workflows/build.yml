name: Build & Release

# Automatically bump version, build macOS & Windows, and publish a new GitHub Release
# whenever new code is merged into main.
# Can also be triggered manually from Actions tab with an optional version override.
on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - '.gitignore'
  workflow_dispatch:
    inputs:
      version_override:
        description: "Custom version override (e.g. 1.3.0). Leave empty for auto-bump."
        type: string
        required: false
        default: ""

# Sequential releases: never run concurrent release jobs to avoid race conditions.
concurrency:
  group: release-production
  cancel-in-progress: false

permissions:
  contents: write

env:
  # Pin the repo's exact toolchain (Flutter 3.44.8).
  FLUTTER_VERSION: "3.44.8"

jobs:
  # ────────────────────────── Version Calculation ──────────────────────────
  version:
    name: Calculate release version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.bump.outputs.version }}
      tag: ${{ steps.bump.outputs.tag }}
      build_number: ${{ steps.bump.outputs.build_number }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Full history needed to inspect previous tags

      - name: Determine next version
        id: bump
        shell: bash
        run: |
          OVERRIDE="${{ inputs.version_override }}"
          if [ -n "$OVERRIDE" ]; then
            CLEAN_VERSION="${OVERRIDE#v}"
            TAG="v${CLEAN_VERSION}"
            echo "Using version override: $CLEAN_VERSION ($TAG)"
            echo "version=$CLEAN_VERSION" >> "$GITHUB_OUTPUT"
            echo "tag=$TAG" >> "$GITHUB_OUTPUT"
            echo "build_number=${{ github.run_number }}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Find highest existing release tag matching vX.Y.Z
          LATEST_TAG=$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n 1)
          if [ -z "$LATEST_TAG" ]; then
            LATEST_TAG="v1.0.0"
          fi
          echo "Previous release tag: $LATEST_TAG"

          RAW_VERSION="${LATEST_TAG#v}"
          IFS='.' read -r MAJOR MINOR PATCH <<< "$RAW_VERSION"
          MAJOR=${MAJOR:-1}
          MINOR=${MINOR:-0}
          PATCH=${PATCH:-0}

          # Commits since last tag
          COMMITS=$(git log "${LATEST_TAG}..HEAD" --pretty=format:"%B" 2>/dev/null || git log -n 1 --pretty=format:"%B")

          # Semantic Versioning rules based on Conventional Commits:
          # - BREAKING CHANGE or <type>!: -> Major
          # - feat: or feat(...): -> Minor
          # - all others (fix, refactor, perf, chore, etc.) -> Patch
          if echo "$COMMITS" | grep -qE "BREAKING CHANGE|^[a-zA-Z]+(\([^)]+\))?!:"; then
            MAJOR=$((MAJOR + 1))
            MINOR=0
            PATCH=0
          elif echo "$COMMITS" | grep -qE "^feat(\([^)]+\))?:"; then
            MINOR=$((MINOR + 1))
            PATCH=0
          else
            PATCH=$((PATCH + 1))
          fi

          NEW_VERSION="${MAJOR}.${MINOR}.${PATCH}"
          NEW_TAG="v${NEW_VERSION}"
          BUILD_NUM="${{ github.run_number }}"

          echo "Calculated version: $NEW_VERSION ($NEW_TAG) build $BUILD_NUM"
          echo "version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$NEW_TAG" >> "$GITHUB_OUTPUT"
          echo "build_number=$BUILD_NUM" >> "$GITHUB_OUTPUT"

  # ───────────────────────────── macOS ─────────────────────────────
  build-macos:
    name: Build macOS (${{ needs.version.outputs.tag }})
    needs: version
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter ${{ env.FLUTTER_VERSION }}
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Enable macOS desktop
        run: flutter config --enable-macos-desktop

      - name: Install dependencies
        run: flutter pub get

      # Codegen (freezed / drift / injectable / retrofit / json) — required
      # because *.g.dart / *.freezed.dart / *.config.dart are gitignored.
      - name: Run code generation
        run: dart run build_runner build --delete-conflicting-outputs

      # Stamp version in pubspec.yaml inside runner
      - name: Stamp version
        shell: bash
        run: |
          sed -i.bak -e "s|^version:.*|version: ${{ needs.version.outputs.version }}+${{ needs.version.outputs.build_number }}|" pubspec.yaml
          rm -f pubspec.yaml.bak

      # Owner/repo come from the repository this workflow runs in, so upstream
      # and forks each build an app that updates from their own releases.
      - name: Point the build at this repository
        shell: bash
        run: |
          sed -i.bak -e "s|^GITHUB_OWNER=.*|GITHUB_OWNER=${{ github.repository_owner }}|" .env
          sed -i.bak -e "s|^GITHUB_REPO=.*|GITHUB_REPO=${{ github.event.repository.name }}|" .env
          rm -f .env.bak

      - name: Build macOS (release, ad-hoc signed)
        run: flutter build macos --release --build-name=${{ needs.version.outputs.version }} --build-number=${{ needs.version.outputs.build_number }} --dart-define-from-file=.env

      # Zip the .app while preserving the bundle (use ditto, not plain zip).
      - name: Package .app
        run: |
          APP="build/macos/Build/Products/Release/WorkNexus.app"
          ditto -c -k --sequesterRsrc --keepParent "$APP" work_nexus-macos.zip

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: worknexus-macos
          path: work_nexus-macos.zip
          if-no-files-found: error

  # ──────────────────────────── Windows ────────────────────────────
  build-windows:
    name: Build Windows (${{ needs.version.outputs.tag }})
    needs: version
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter ${{ env.FLUTTER_VERSION }}
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      # The repo has no windows/ folder yet -> generate the runner in place.
      # --project-name work_nexus because the "WorkNexus" folder (uppercase) is
      # not a valid Dart package name. This only adds windows/, never touches lib/.
      - name: Generate Windows runner
        run: flutter create --platforms=windows --project-name work_nexus .

      - name: Install dependencies
        run: flutter pub get

      - name: Run code generation
        run: dart run build_runner build --delete-conflicting-outputs

      # Stamp version in pubspec.yaml inside runner
      - name: Stamp version
        shell: bash
        run: |
          sed -i.bak -e "s|^version:.*|version: ${{ needs.version.outputs.version }}+${{ needs.version.outputs.build_number }}|" pubspec.yaml
          rm -f pubspec.yaml.bak

      # Owner/repo come from the repository this workflow runs in, so upstream
      # and forks each build an app that updates from their own releases.
      - name: Point the build at this repository
        shell: bash
        run: |
          sed -i.bak -e "s|^GITHUB_OWNER=.*|GITHUB_OWNER=${{ github.repository_owner }}|" .env
          sed -i.bak -e "s|^GITHUB_REPO=.*|GITHUB_REPO=${{ github.event.repository.name }}|" .env
          rm -f .env.bak

      - name: Build Windows (release)
        run: flutter build windows --release --build-name=${{ needs.version.outputs.version }} --build-number=${{ needs.version.outputs.build_number }} --dart-define-from-file=.env

      # Zip the whole Release folder (exe + DLLs + data/ must stay together).
      - name: Package build output
        shell: pwsh
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath worknexus-windows.zip

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: worknexus-windows
          path: worknexus-windows.zip
          if-no-files-found: error

  # ───────────────────── Publish GitHub Release ─────────────────────
  release:
    name: Publish Release ${{ needs.version.outputs.tag }}
    needs: [version, build-macos, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # The in-app updater refuses a download whose hash is not listed here.
      - name: Write checksums
        working-directory: dist
        run: sha256sum *.zip > SHA256SUMS.txt

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ needs.version.outputs.tag }}" \
            dist/*.zip dist/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "${{ needs.version.outputs.tag }}" \
            --generate-notes
