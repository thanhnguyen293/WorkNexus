name: Build & Release

# Automatically bump version, build macOS, Windows & Linux, and publish a new GitHub Release
# whenever new code is merged into main.
# Can also be triggered manually from Actions tab with an optional version override.
on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - '.gitignore'
  workflow_dispatch:
    inputs:
      version_override:
        description: "Custom version override (e.g. 1.3.0). Leave empty for auto-bump."
        type: string
        required: false
        default: ""

# Sequential releases: never run concurrent release jobs to avoid race conditions.
concurrency:
  group: release-production
  cancel-in-progress: false

permissions:
  contents: write

env:
  # Pin the repo's exact toolchain (Flutter 3.44.8).
  FLUTTER_VERSION: "3.44.8"

jobs:
  # ────────────────────────── Version Calculation ──────────────────────────
  version:
    name: Calculate release version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.bump.outputs.version }}
      tag: ${{ steps.bump.outputs.tag }}
      build_number: ${{ steps.bump.outputs.build_number }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # Full history needed to inspect previous tags

      - name: Determine next version
        id: bump
        shell: bash
        run: |
          OVERRIDE="${{ inputs.version_override }}"
          if [ -n "$OVERRIDE" ]; then
            CLEAN_VERSION="${OVERRIDE#v}"
            TAG="v${CLEAN_VERSION}"
            echo "Using version override: $CLEAN_VERSION ($TAG)"
            echo "version=$CLEAN_VERSION" >> "$GITHUB_OUTPUT"
            echo "tag=$TAG" >> "$GITHUB_OUTPUT"
            echo "build_number=${{ github.run_number }}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Find highest existing release tag matching vX.Y.Z
          LATEST_TAG=$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n 1)
          if [ -z "$LATEST_TAG" ]; then
            LATEST_TAG="v1.0.0"
          fi
          echo "Previous release tag: $LATEST_TAG"

          RAW_VERSION="${LATEST_TAG#v}"
          IFS='.' read -r MAJOR MINOR PATCH <<< "$RAW_VERSION"
          MAJOR=${MAJOR:-1}
          MINOR=${MINOR:-0}
          PATCH=${PATCH:-0}

          # Commits since last tag
          COMMITS=$(git log "${LATEST_TAG}..HEAD" --pretty=format:"%B" 2>/dev/null || git log -n 1 --pretty=format:"%B")

          # Semantic Versioning rules based on Conventional Commits:
          # - BREAKING CHANGE or <type>!: -> Major
          # - feat: or feat(...): -> Minor
          # - all others (fix, refactor, perf, chore, etc.) -> Patch
          if echo "$COMMITS" | grep -qE "BREAKING CHANGE|^[a-zA-Z]+(\([^)]+\))?!:"; then
            MAJOR=$((MAJOR + 1))
            MINOR=0
            PATCH=0
          elif echo "$COMMITS" | grep -qE "^feat(\([^)]+\))?:"; then
            MINOR=$((MINOR + 1))
            PATCH=0
          else
            PATCH=$((PATCH + 1))
          fi

          NEW_VERSION="${MAJOR}.${MINOR}.${PATCH}"
          NEW_TAG="v${NEW_VERSION}"
          BUILD_NUM="${{ github.run_number }}"

          echo "Calculated version: $NEW_VERSION ($NEW_TAG) build $BUILD_NUM"
          echo "version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$NEW_TAG" >> "$GITHUB_OUTPUT"
          echo "build_number=$BUILD_NUM" >> "$GITHUB_OUTPUT"

  # ───────────────────────────── Desktop ─────────────────────────────
  build-desktop:
    name: Build ${{ matrix.name }} (${{ needs.version.outputs.tag }})
    needs: version
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: macos, name: macOS, os: macos-latest, artifact: macos, file: WorkNexus-macos-universal.zip, installer: WorkNexus-macos-universal.dmg }
          - { platform: windows, name: Windows, os: windows-latest, artifact: windows, file: WorkNexus-windows-x64.zip, installer: WorkNexus-windows-x64-setup.exe }
          # Pinned to the oldest supported distro: binaries only run on a glibc /
          # libstdc++ at least as new as the build host's, so ubuntu-latest
          # (24.04, glibc 2.39) would break the app on Ubuntu 22.04.
          - { platform: linux, name: Linux, os: ubuntu-22.04, artifact: linux, file: WorkNexus-linux-x64.tar.gz, installer: WorkNexus-linux-x64.deb, appimage: WorkNexus-linux-x64.AppImage }
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Flutter's GTK toolchain, plus the native libraries the plugins link:
      # libsecret (flutter_secure_storage), ayatana-appindicator (tray_manager),
      # and patchelf to point the bundled tray libraries at each other.
      - name: Install Linux build dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libstdc++-12-dev \
            libsecret-1-dev libayatana-appindicator3-dev patchelf \
            libwebkit2gtk-4.1-dev

      - name: Prepare Flutter
        uses: ./.github/actions/prepare-flutter
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          version: ${{ needs.version.outputs.version }}
          build-number: ${{ needs.version.outputs.build_number }}
          desktop: ${{ matrix.platform }}

      # --project-name work_nexus because the "WorkNexus" folder (uppercase) is
      # not a valid Dart package name. This only touches windows/, never lib/.
      - name: Generate Windows runner
        if: matrix.platform == 'windows'
        run: flutter create --platforms=windows --project-name work_nexus .

      - name: Build ${{ matrix.name }} (release)
        shell: bash
        run: flutter build ${{ matrix.platform }} --release --build-name=${{ needs.version.outputs.version }} --build-number=${{ needs.version.outputs.build_number }} --dart-define-from-file=.env

      # Before the check below, which then covers the bundled libraries too.
      - name: Bundle tray libraries (Linux)
        if: matrix.platform == 'linux'
        run: bash packaging/linux/bundle_libs.sh build/linux/x64/release/bundle

      # Fails the release if any bundled binary needs a newer glibc (> 2.35) or
      # libstdc++ (> GLIBCXX_3.4.30) than Ubuntu 22.04 ships.
      - name: Check Ubuntu 22.04 compatibility
        if: matrix.platform == 'linux'
        run: |
          status=0
          for f in build/linux/x64/release/bundle/WorkNexus build/linux/x64/release/bundle/lib/*.so*; do
            # grep exits 1 on a clean binary; under `bash -e -o pipefail` that
            # would abort the loop, so only grep's no-match is tolerated.
            too_new=$(objdump -T "$f" | { grep -oE 'GLIBC_2\.(3[6-9]|[4-9][0-9])|GLIBCXX_3\.4\.(3[1-9]|[4-9][0-9])' || true; } | sort -u | tr '\n' ' ')
            if [ -n "$too_new" ]; then echo "$f needs $too_new"; status=1; fi
          done
          exit $status

      # ditto (not zip) preserves the .app bundle.
      - name: Package (macOS)
        if: matrix.platform == 'macos'
        run: ditto -c -k --sequesterRsrc --keepParent build/macos/Build/Products/Release/WorkNexus.app ${{ matrix.file }}

      # The whole Release folder (exe + DLLs + data/) must stay together.
      - name: Package (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath ${{ matrix.file }}

      # Tarball (not zip) keeps the executable bit on the binary.
      - name: Package (Linux)
        if: matrix.platform == 'linux'
        run: tar -czf ${{ matrix.file }} -C build/linux/x64/release/bundle .

      # Installers sit beside the archives above: the in-app updater keeps
      # downloading the archive, these are for a first install (except the
      # AppImage, which an app started from one updates from).
      - name: Build installer (macOS .dmg)
        if: matrix.platform == 'macos'
        run: bash packaging/macos/build_dmg.sh build/macos/Build/Products/Release/WorkNexus.app ${{ matrix.installer }}

      # Inno Setup ships on the windows-latest image.
      - name: Build installer (Windows setup.exe)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6/ISCC.exe' }
          & $iscc /DAppVersion=${{ needs.version.outputs.version }} "/DSourceDir=$PWD/build/windows/x64/runner/Release" "/DOutputDir=$PWD" "/DOutputName=$([IO.Path]::GetFileNameWithoutExtension('${{ matrix.installer }}'))" packaging/windows/installer.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build installer (Linux .deb)
        if: matrix.platform == 'linux'
        run: bash packaging/linux/build_deb.sh ${{ needs.version.outputs.version }} build/linux/x64/release/bundle ${{ matrix.installer }}

      - name: Build installer (Linux .AppImage)
        if: matrix.platform == 'linux'
        run: bash packaging/linux/build_appimage.sh ${{ needs.version.outputs.version }} build/linux/x64/release/bundle ${{ matrix.appimage }}

      # matrix.appimage is empty off Linux; upload-artifact skips empty lines.
      - name: Upload ${{ matrix.name }} artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.file }}
            ${{ matrix.installer }}
            ${{ matrix.appimage }}
          if-no-files-found: error

  # ───────────────────── Publish GitHub Release ─────────────────────
  release:
    name: Publish Release ${{ needs.version.outputs.tag }}
    needs: [version, build-desktop]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      # Builds from before the WorkNexus-<os>-<arch> naming still look for these
      # names; keep publishing them until those builds have updated. Asset names
      # are case-insensitive on GitHub, so the Linux archive cannot carry both
      # spellings: it goes out under the old one, which the new updater also
      # matches (it compares names case-insensitively).
      - name: Add legacy archive names
        working-directory: dist
        run: |
          cp WorkNexus-windows-x64.zip worknexus-windows.zip
          cp WorkNexus-macos-universal.zip work_nexus-macos.zip
          mv WorkNexus-linux-x64.tar.gz worknexus-linux-x64.tar.gz

      # The in-app updater refuses a download whose hash is not listed here.
      - name: Write checksums
        working-directory: dist
        run: sha256sum *.zip *.tar.gz *.dmg *.exe *.deb *.AppImage > SHA256SUMS.txt

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ needs.version.outputs.tag }}" \
            dist/*.zip dist/*.tar.gz dist/*.dmg dist/*.exe dist/*.deb dist/*.AppImage dist/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "${{ needs.version.outputs.tag }}" \
            --generate-notes
